[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmolspec"
version = "1.0.0"
description = "OpenMolSpec data processing, validation, and release toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "PyYAML>=6",
    "rdkit>=2023.9",
    "transformers==4.44.2"
]


[project.scripts]
openmolspec = "openmolspec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
