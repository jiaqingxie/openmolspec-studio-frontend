[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmolspec"
version = "1.0.0"
description = "OpenMolSpec data processing, validation, and release toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "PyYAML>=6",
    "rdkit>=2023.9",
    "transformers==4.44.2"
]


[project.scripts]
openmolspec = "openmolspec.cli:main"
openmolspec-bench = "openmolspec_bench.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["openmolspec", "openmolspec.*", "openmolspec_ui", "openmolspec_bench", "spec2struct_fork"]

[tool.setuptools.package-data]
spec2struct_fork = ["assets/mol_tokenizer/*"]
