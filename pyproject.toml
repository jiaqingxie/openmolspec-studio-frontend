[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmolspec"
version = "1.0.0"
description = "Spectroscopy datasets, model interfaces and reproducible learning workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hsqc = ["numpy>=1.24", "scipy>=1.10", "rdkit>=2023.9", "torch>=2.4", "torch-geometric==2.7.0"]
mcp = ["mcp>=2,<3"]
data = ["numpy>=1.26", "pandas>=2", "pyarrow>=14", "rdkit>=2023.9", "lmdb>=1.4"]
analysis = ["numpy>=1.26", "scipy>=1.10", "matplotlib>=3.8", "rdkit>=2023.9"]
models = ["numpy>=1.26", "scipy>=1.10", "rdkit>=2023.9", "torch>=2.4", "tqdm>=4.65", "transformers==4.44.2"]
train = ["numpy>=1.26", "rdkit>=2023.9", "torch>=2.4", "tqdm>=4.65", "transformers==4.44.2"]
production = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "PyYAML>=6",
    "rdkit>=2023.9"
]


[project.scripts]
openmolspec = "openmolspec.cli:main"
openmolspec-bench = "openmolspec_bench.__main__:main"
spectra-harness = "openmolspec.harness:main"
openmolspec-mcp = "openmolspec.mcp:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["openmolspec", "openmolspec.*", "openmolspec_ui", "openmolspec_bench", "spec2struct_fork"]

[tool.setuptools.package-data]
openmolspec = ["assets/*.json"]
spec2struct_fork = ["assets/mol_tokenizer/*"]
