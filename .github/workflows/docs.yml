name: Documentation
on:
  push:
    branches: [main, release/openmolspec-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/render_task_catalog.py --check
      - run: python scripts/build_bilingual_docs.py --check
      - run: python scripts/build_sdk_notebooks.py --check
      - run: python -m unittest discover -s tests -p test_docs_html_build.py
      - run: python -m unittest discover -s tests -p test_readthedocs_publish.py
      - run: python scripts/build_readthedocs.py --output site --strict
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site
