name: Python SDK
on:
  push:
    branches: [main, release/openmolspec-v1]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m pip install --no-deps dist/*.whl
      - name: Import installed wheel outside checkout without model dependencies
        working-directory: /tmp
        run: |
          python - <<'PY'
          import sys
          from openmolspec.dataset import list_datasets
          from openmolspec.model import NMRNet, NMRTransformer
          from openmolspec.task import list_tasks
          assert {'opendatalab_nmr', 'massspecgym_1_5'} <= {c['name'] for c in list_datasets()}
          tasks = list_tasks()
          assert len(tasks) == 32
          assert 'nmr.hsqc.transpeaknet' in {task['id'] for task in tasks}
          assert all(name not in sys.modules for name in ('torch', 'numpy', 'rdkit', 'pandas'))
          PY
      - run: python -m pip install numpy scipy rdkit
      - run: python -m unittest discover -s tests -p test_public_sdk.py -v
      - run: python -m unittest discover -s tests -p test_training_integrity.py -v
      - run: python -m unittest discover -s tests -p test_dataset_splits.py -v
      - run: python -m unittest discover -s tests -p test_inversion.py -v
      - run: python -m unittest discover -s tests -p test_spectra_harness.py -v
      - run: python -m unittest discover -s tests -p test_online_api.py -v
      - run: python -m pip install '.[mcp]'
      - name: Exercise MCP stdio handshake and tools
        run: python scripts/verify_spectra_mcp.py --output spectra-mcp-protocol.json
      - uses: actions/upload-artifact@v4
        with:
          name: openmolspec-wheel-${{ matrix.python }}
          path: dist/*.whl
