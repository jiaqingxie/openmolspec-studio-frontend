name: Benchmark integration checks
on:
  push:
    branches: [main, release/openmolspec-v1]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install . numpy scipy rdkit
      - run: python -m unittest discover -s tests -p test_benchmark_v1.py -v
      - run: python -m unittest discover -s tests -p test_ms_adapters.py -v
      - run: python -m compileall -q openmolspec_bench openmolspec_ui spec2struct_fork
