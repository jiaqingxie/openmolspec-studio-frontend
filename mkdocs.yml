site_name: OpenMolSpec v1.0
site_description: Pretrained spectroscopy tasks, reproducible evaluation, and online prediction
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'http://localhost:8000/']
repo_url: https://github.com/jiaqingxie/openmolspec-studio-frontend
docs_dir: documentation
site_dir: site
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Quick start: 快速开始
            Tasks: 任务目录
            Notebooks: Notebook 展示
            Dataset Download: 数据下载
            Evaluation protocols: 评测协议
            Publication: 发布状态
  - mkdocs-jupyter:
      include: ['*.ipynb']
      execute: false
      include_source: true
markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Tasks: tasks/index.md
  - Notebooks: notebooks/index.md
  - Dataset Download: datasets.md
  - Evaluation protocols: protocols.md
  - Publication: publication.md
