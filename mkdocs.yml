site_name: OpenMolSpec v1.0 使用手册
site_description: 谱学任务、现有模型推理和可复现评测
site_url: https://jiaqingxie.github.io/openmolspec-studio-frontend/
repo_url: https://github.com/jiaqingxie/openmolspec-studio-frontend
docs_dir: handbook
site_dir: site
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true
nav:
  - 欢迎: index.md
  - 安装与首次运行: quickstart.md
  - 任务目录: tasks.md
  - 数据与输入格式: data.md
  - 基准评测: benchmark.md
  - Studio 操作: studio.md
  - 评测结果: results.md
  - 常见问题: troubleshooting.md
  - 文档维护与发布: development.md
