release:
  release_id: openmolspec-20260830-v1
  dataset_version: "1.0.0"
  output_dir: builds/openmolspec-20260830/release-v1
  status: frozen-candidate
  splits:
    seed: 2025
    align_train_count: 1000000
    validation_count: 10390
    test_count: 20390
  export:
    format: parquet+hdf5
    compression: lzf
    workers: 4
    frequency_shard_size: 10000
    nmr_shard_size: 10000
    trajectory_shard_size: 25000

