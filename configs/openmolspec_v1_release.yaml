    - trajectory_outputs/openspec_qm9_opt_trajectories.pickle
    - trajectory_outputs/openspec_rxn_opt_trajectories.pickle
    - trajectory_outputs/openspec_sdbs_opt_trajectories.pickle
    - trajectory_outputs/openspec_wiley_ir_opt_trajectories.pickle
    - trajectory_outputs/openspec_wiley_raman_opt_trajectories.pickle
    - trajectory_outputs/openspec_peptide_opt_trajectories.pickle
