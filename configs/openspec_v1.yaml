schema_version: "1.0"
parser_version: "0.1.0"
processing_version: "1.0.0"

# This file mirrors the authoritative definitions in src/openmolspec/core/schema.py and
# is intended for release/QC tools. Scientific constants remain in Python so
# numerical code has one importable source of truth.
calculation_metadata:
  gaussian_version: null
  functional: null
  basis_set: null
  charge: null
  multiplicity: null

spectrum_processing:
  frequency_min_cm-1: 400.0
  frequency_max_cm-1: 4000.0
  frequency_grid_size: 1024
  frequency_scaling_factor: 0.965
  line_shape: lorentzian
  ir_broadening_sigma_cm-1: 20.0
  raman_broadening_sigma_cm-1: 12.0
  raman_temperature_K: 298.0
  raman_excitation_wavelength_nm: 532.0
  nmr_frequency_min: 0.0
  nmr_frequency_max: 12.0
  nmr_grid_size: 1024
  nmr_broadening_sigma: 0.05

fields:
  sample_id:
    dtype: string
    shape: scalar
    unit: null
    required: true
    missing_value_policy: must be present
    description: Globally unique sample identifier.
  source_dataset:
    dtype: string
    shape: scalar
    unit: null
    required: true
    missing_value_policy: must be present
    description: Name of the original source dataset.
  source_id:
    dtype: string
    shape: scalar
    unit: null
    required: true
    missing_value_policy: must be present
    description: Identifier in the original source dataset.
  smiles:
    dtype: string
    shape: scalar
    unit: null
    required: false
    missing_value_policy: null and list in missing_fields
    description: Input or source SMILES.
  canonical_smiles:
    dtype: string
    shape: scalar
    unit: null
    required: false
    missing_value_policy: null and list in missing_fields
    description: Standardized canonical SMILES.
  inchikey:
    dtype: string
    shape: scalar
    unit: null
    required: false
    missing_value_policy: null and list in missing_fields
    description: InChIKey used for molecular identity.
  atomic_numbers:
    dtype: int32
    shape: N
    unit: null
    required: true
    missing_value_policy: null and list in missing_fields
    description: Atomic number for each atom.
  coordinates:
    dtype: float32
    shape: N x 3
    unit: angstrom
    required: false
    missing_value_policy: null and list in missing_fields
    description: Optimized Cartesian coordinates.
  energy:
    dtype: float64
    shape: scalar or source-defined
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Electronic energy.
  zpve:
    dtype: float64
    shape: scalar or source-defined
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Zero-point vibrational energy.
  U0:
    dtype: float64
    shape: scalar or source-defined
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Energy plus zero-point vibrational energy.
  U:
    dtype: float64
    shape: scalar or source-defined
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Internal energy.
  H:
    dtype: float64
    shape: scalar or source-defined
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Enthalpy.
  G:
    dtype: float64
    shape: scalar or source-defined
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Gibbs free energy.
  dipole:
    dtype: float64
    shape: source-defined
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Dipole-related archive quantity.
  polarizability:
    dtype: float64
    shape: 3 x 3
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Polarizability tensor.
  homo:
    dtype: float64
    shape: scalar
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: HOMO energy.
  lumo:
    dtype: float64
    shape: scalar
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: LUMO energy.
  gap:
    dtype: float64
    shape: scalar
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: LUMO minus HOMO.
  hessian:
    dtype: float32
    shape: 3N x 3N
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Cartesian Hessian matrix.
  frequencies:
    dtype: float64
    shape: variable
    unit: cm^-1
    required: false
    missing_value_policy: null and flag
    description: Vibrational frequencies after documented scaling.
  ir_intensities:
    dtype: float64
    shape: variable
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Raw IR intensities.
  ir_spectrum:
    dtype: float64
    shape: fixed grid
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Broadened IR spectrum.
  raman_activities:
    dtype: float64
    shape: variable
    unit: source-defined
    required: false
    missing_value_policy: null and flag
    description: Raw Raman activities.
  raman_spectrum:
    dtype: float64
    shape: fixed grid
    unit: documented intensity
    required: false
    missing_value_policy: null and flag
    description: Broadened Raman intensity spectrum.
  nmr_isotropic:
    dtype: float64
    shape: variable
    unit: documented NMR unit
    required: false
    missing_value_policy: null and flag
    description: Per-atom isotropic shielding or shift.
  nmr_anisotropy:
    dtype: float64
    shape: variable
    unit: documented NMR unit
    required: false
    missing_value_policy: null and flag
    description: Per-atom NMR anisotropy.
  nmr_tensor:
    dtype: float64
    shape: N x 3 x 3
    unit: documented NMR unit
    required: false
    missing_value_policy: null and flag
    description: Per-atom NMR shielding tensor.
  nmr_shifts:
    dtype: float64
    shape: variable or fixed grid
    unit: ppm or documented
    required: false
    missing_value_policy: null and flag
    description: NMR chemical shifts or processed NMR spectrum.
  source_file_hash:
    dtype: string
    shape: scalar
    unit: SHA-256
    required: false
    missing_value_policy: must be present when source is available
    description: Hash of the source file.
  frequency_file_hash:
    dtype: string
    shape: scalar
    unit: SHA-256
    required: false
    missing_value_policy: null when frequency source is unavailable
    description: Hash of the Gaussian frequency/property source log.
  nmr_file_hash:
    dtype: string
    shape: scalar
    unit: SHA-256
    required: false
    missing_value_policy: null when NMR source is unavailable
    description: Hash of the Gaussian NMR source log.
  parser_version:
    dtype: string
    shape: scalar
    unit: null
    required: true
    missing_value_policy: must be present
    description: Parser version.
  processing_version:
    dtype: string
    shape: scalar
    unit: null
    required: true
    missing_value_policy: must be present
    description: Processing convention version.
  quality_flags:
    dtype: list[string]
    shape: variable
    unit: null
    required: false
    missing_value_policy: empty list if none
    description: Non-destructive validation and provenance flags.
  missing_fields:
    dtype: list[string]
    shape: variable
    unit: null
    required: false
    missing_value_policy: empty list if none
    description: Fields unavailable for this record.
